[tool.poetry]
name = "ocr-service"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"  # 改为 3.10
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
python-multipart = "^0.0.9"
# ⚠️ 注意：Paddle 官方推荐 cpu 版本以减小体积，如果需要 GPU 需改名
# 这里使用通用名称，Poetry 会自动解析
paddlepaddle = ">=2.6.0"
paddleocr = ">=2.7.0"
# Protobuf 版本冲突是 Paddle 的常见问题，通常锁定在 3.20.x 比较安全
# 但新版 Paddle 可能支持 4.x，如果报错再限制
protobuf = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"